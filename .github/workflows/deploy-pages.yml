name: Build and Deploy to Static Repo

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram (Build Started)
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🏗 *Frontend Build & Deploy Started*
            
            🏷 *Repo:* ${{ github.repository }}
            👤 *Author:* ${{ github.actor }}
            🔗 [View Progress](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Public Repo
        env:
          API_TOKEN_GITHUB: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          cd dist
          # Fix for GitHub Pages SPA routing
          cp index.html 404.html
          touch .nojekyll
          git init
          git config user.name "shadowmind1337"
          git config user.email "shadowmind1337@gmail.com"
          git add .
          git commit -m "Deploy build to static repo with SPA fix"
          git push --force https://x-access-token:${API_TOKEN_GITHUB}@github.com/boilerplate1/panel-static.git master:main

      - name: Notify Telegram (Success)
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ✅ *Frontend (Sub) Deployed Successfully!*
            
            🏷 *Repo:* ${{ github.repository }}
            👤 *Author:* ${{ github.actor }}
            📝 *Commit:* ${{ github.event.head_commit.message }}
            🔗 [View Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Notify Telegram (Failure)
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ❌ *Frontend (Sub) Deployment Failed!*
            
            🏷 *Repo:* ${{ github.repository }}
            👤 *Author:* ${{ github.actor }}
            📝 *Commit:* ${{ github.event.head_commit.message }}
            🔗 [Check Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
