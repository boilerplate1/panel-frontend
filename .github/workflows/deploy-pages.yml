name: Build and Deploy to Static Repo

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram (Build Started)
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🏗 *Frontend (Root) Build & Deploy Started*
            
            🏷 *Repo:* ${{ github.repository }}
            👤 *Author:* ${{ github.actor }}
            🔗 [View Progress](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: https://prod-v1-api.umbr.rest/api
          VITE_TURNSTILE_SITE_KEY: 0x4AAAAAADksO24nf-9vXTAc
          VITE_ANDROID_APK_URL: https://hpxvpn.xyz/downloads/hypexvpn.apk
          VITE_BASE_URL: https://my.hpxvpn.xyz
        run: npm run build

      - name: Deploy to Public Repo
        env:
          API_TOKEN_GITHUB: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          cd frontend/dist
          echo "my.hpxvpn.xyz" > CNAME
          cp index.html 404.html
          touch .nojekyll
          git init
          git config user.name "shadowmind1337"
          git config user.email "shadowmind1337@gmail.com"
          git add .
          git commit -m "Deploy build to static repo with SPA fix"
          git push --force https://x-access-token:${API_TOKEN_GITHUB}@github.com/boilerplate1/panel-static.git master:main

      - name: Notify Telegram (Success)
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ✅ *Frontend Deployed Successfully!*
            
            🏷 *Repo:* ${{ github.repository }}
            👤 *Author:* ${{ github.actor }}
            📝 *Commit:* ${{ github.event.head_commit.message }}
            🔗 [View Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Notify Telegram (Failure)
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ❌ *Frontend Deployment Failed!*
            
            🏷 *Repo:* ${{ github.repository }}
            👤 *Author:* ${{ github.actor }}
            📝 *Commit:* ${{ github.event.head_commit.message }}
            📉 *Status:* Build or Push to static repo failed.
            🔗 [Check Error Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
