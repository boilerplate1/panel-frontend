name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_API_URL: https://prod-v1-api.umbr.rest/api
          VITE_RECAPTCHA_SITE_KEY: 0x4AAAAAADksO24nf-9vXTAc
          VITE_ANDROID_APK_URL: https://hpxvpn.xyz/downloads/hypexvpn.apk
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=hypex-frontend
