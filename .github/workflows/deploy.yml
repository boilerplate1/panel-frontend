name: Frontend CI/CD (No Source on Server)

on:
  push:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hypex-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Notify Telegram (Build Started)
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Frontend Build Started

            Repo: ${{ github.repository }}
            Author: ${{ github.actor }}
            Progress: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Notify Telegram (Deployment Started)
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Frontend Deployment Started

            Repo: ${{ github.repository }}
            Author: ${{ github.actor }}
            Progress: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Checkout code (for docker-compose file)
        uses: actions/checkout@v4

      - name: Prepare deploy directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: |
            ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p /opt/hypex/frontend

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: |
            ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/hypex/frontend"
          strip_components: 0

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: |
            ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/hypex/frontend

            if [ ! -f .env ]; then
              cat > .env <<'EOF'
            VITE_API_URL=https://prod-v1-api.umbr.rest/api
            VITE_TURNSTILE_SITE_KEY=0x4AAAAAADksO24nf-9vXTAc
            VITE_ANDROID_APK_URL=https://hpxvpn.xyz/downloads/hypexvpn.apk
            VITE_BASE_URL=https://my.hpxvpn.xyz
            EOF
            fi

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}

            docker compose pull
            docker compose up -d
            docker image prune -f

      - name: Notify Telegram (Success)
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Frontend Deployed Successfully

            Repo: ${{ github.repository }}
            Author: ${{ github.actor }}
            Commit: ${{ github.event.head_commit.message }}
            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Notify Telegram (Failure)
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Frontend Deployment Failed

            Repo: ${{ github.repository }}
            Author: ${{ github.actor }}
            Commit: ${{ github.event.head_commit.message }}
            Status: Build or deploy step failed.
            Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
