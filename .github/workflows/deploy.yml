name: Frontend CI/CD

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram (Build Started)
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🏗 *Frontend Build Started*
            
            🏷 *Repo:* ${{ github.repository }}
            👤 *Author:* ${{ github.actor }}
            🔗 [View Progress](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install and Build
        env:
          VITE_API_URL: https://prod-v1-api.umbr.rest/api
          VITE_TURNSTILE_SITE_KEY: 0x4AAAAAADksO24nf-9vXTAc
          VITE_ANDROID_APK_URL: https://hpxvpn.xyz/downloads/hypexvpn.apk
          VITE_BASE_URL: https://my.hpxvpn.xyz
        run: |
          npm install
          npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram (Deployment Started)
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 *Frontend Deployment Started*
            
            🏷 *Repo:* ${{ github.repository }}
            👤 *Author:* ${{ github.actor }}
            🔗 [View Progress](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Server via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: |
            ${{ secrets.SSH_KEY }}
          source: "dist/*"
          target: "/opt/hypex/frontend"
          strip_components: 1

      - name: Notify Telegram (Success)
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ✅ *Frontend Deployed Successfully!*
            
            🏷 *Repo:* ${{ github.repository }}
            👤 *Author:* ${{ github.actor }}
            📝 *Commit:* ${{ github.event.head_commit.message }}
            🔗 [View Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Notify Telegram (Failure)
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ❌ *Frontend Deployment Failed!*
            
            🏷 *Repo:* ${{ github.repository }}
            👤 *Author:* ${{ github.actor }}
            📝 *Commit:* ${{ github.event.head_commit.message }}
            📉 *Status:* Build or Deploy step failed.
            🔗 [Check Error Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
