name: Deploy Frontend
on:
  push:
    branches: ["master", "main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build
        env:
          VITE_API_URL: https://prod-v1-api.umbr.rest/api
          VITE_BASE_URL: https://my.hpxvpn.xyz
        run: |
          npm install
          npm run build
      - name: Deploy to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "dist/*"
          target: "/opt/hypex/frontend"
          strip_components: 1
