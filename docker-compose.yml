version: '3.9'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: hypex-web
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    networks:
      - hypex-network

networks:
  hypex-network:
    external: true
